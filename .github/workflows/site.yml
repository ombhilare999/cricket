name: Update site

# - Issue titled "Add match…" (opened from the site's Add a match page) -> check and add the match,
#   reply on the issue, deploy
# - Run workflow by hand with a link -> same, without the issue
# - Push to main -> run tests and deploy
on:
  push:
    branches: [main]
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      url:
        description: CricClubs full scorecard link (leave empty to just redeploy)
        required: false
        type: string

run-name: >-
  ${{ github.event_name == 'issues' && format('Add match from issue #{0}', github.event.issue.number)
  || inputs.url && format('Add match {0}', inputs.url)
  || format('Deploy {0}', github.sha) }}

permissions:
  contents: write
  issues: write
  pages: write
  id-token: write

# never let two runs write data at the same time
concurrency:
  group: site
  cancel-in-progress: false

jobs:
  ingest:
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.url != '') ||
      (github.event_name == 'issues' && startsWith(github.event.issue.title, 'Add match'))
    runs-on: ubuntu-latest
    outputs:
      added: ${{ steps.parse.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Check and parse match
        id: parse
        continue-on-error: true
        # The issue body is untrusted text: it is passed only through an env var and the
        # script extracts and strictly validates the cricclubs link from it.
        env:
          MATCH_URL: ${{ inputs.url }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          if [ -n "$MATCH_URL" ]; then
            node scripts/ingest.mjs --url "$MATCH_URL" --result result.md
          else
            node scripts/ingest.mjs --from-text "$ISSUE_BODY" --result result.md
          fi
      - name: Commit data
        if: steps.parse.outcome == 'success'
        run: |
          git config user.name "tbf-stats-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Add match $(ls -t data/matches/*.json | head -1 | xargs basename .json)"
          git push
      - name: Reply on the issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        env:
          ADDED: ${{ steps.parse.outcome == 'success' }}
        with:
          script: |
            const fs = require('fs');
            const added = process.env.ADDED === 'true';
            let body = fs.existsSync('result.md') ? fs.readFileSync('result.md', 'utf8') : '### ❌ Something went wrong while checking this match.';
            body += `\n\n[Run log](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`;
            const issue_number = context.issue.number;
            await github.rest.issues.createComment({ ...context.repo, issue_number, body });
            await github.rest.issues.update({ ...context.repo, issue_number, state: 'closed', state_reason: added ? 'completed' : 'not_planned' });
      - name: Fail the run if the match was rejected
        if: steps.parse.outcome != 'success'
        run: exit 1

  deploy:
    needs: ingest
    if: >-
      !cancelled() && (
        github.event_name == 'push' ||
        (github.event_name == 'workflow_dispatch' && inputs.url == '') ||
        needs.ingest.outputs.added == 'true'
      )
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main # include the commit the ingest job just pushed
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Rebuild season.json (picks up roster alias edits)
        run: node scripts/build-season.mjs
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html add.html assets _site/
          cp data/*.json _site/data/
          cp -r data/matches _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
