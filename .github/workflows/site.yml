name: Deploy site

# Matches are added from the admin page (/cricket/admin/), which commits straight to main.
# Every push to main (or a manual run) tests the parser, rebuilds season.json and deploys.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Rebuild season.json (picks up roster alias edits)
        run: node scripts/build-season.mjs
      - name: Assemble site
        run: |
          mkdir -p _site/data
          cp -r index.html admin assets _site/
          cp data/*.json _site/data/
          cp -r data/matches _site/data/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
